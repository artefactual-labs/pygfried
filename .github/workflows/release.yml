name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in stable X.Y.Z format.
        required: true
        type: string
      ref:
        description: Git ref or commit SHA to release from.
        required: false
        default: main
        type: string

defaults:
  run:
    shell: bash

jobs:
  validate:
    timeout-minutes: 10
    name: Validate release inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.validate.outputs.package_version }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release inputs
        id: validate
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: main
          PACKAGE_NAME: pygfried
        run: bash ./.github/scripts/validate-release-inputs.sh

  build:
    permissions:
      contents: read
    name: Build release artifacts
    needs: validate
    uses: $/.github/workflows/_build.yml
    with:
      ref: ${{ needs.validate.outputs.release_sha }}
      package_version: ${{ needs.validate.outputs.package_version }}

  publish:
    timeout-minutes: 15
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs:
      - validate
      - build
    environment: release
    permissions:
      contents: write # Create the GitHub release and tag.
      id-token: write # Sign attestations and authenticate to PyPI with OIDC.
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download sdist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-sdist
          path: all_build_artifacts/sdist
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: python-wheel-*
          path: all_build_artifacts/wheels
      - name: Prepare packages for publishing
        shell: bash
        run: |
          mkdir -p dist
          find all_build_artifacts/sdist -type f -name '*.tar.gz' -exec cp {} dist/ \;
          find all_build_artifacts/wheels -type f -name '*.whl' -exec cp {} dist/ \;
          echo "Contents of dist/ before publishing:"
          ls -R dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Generate PyPI attestations
        shell: bash
        run: uv run --locked --only-group publish python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
      - name: Upload distribution packages to PyPI
        run: uv publish --trusted-publishing always
      - name: Create GitHub release and tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG_NAME} already exists; skipping creation."
            exit 0
          fi
          python3 ./.github/scripts/generate-release-notes.py "${TAG_NAME}" "${RELEASE_SHA}" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${TAG_NAME}" --target "${RELEASE_SHA}" --title "${TAG_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md"
