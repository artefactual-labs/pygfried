name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test.
        required: true
        type: string
      package_version:
        description: Exact PEP 440 version to inject during the build.
        required: false
        default: ""
        type: string

env:
  # Fail if uv.lock would need to change.
  UV_LOCKED: "1"
  # Provision host interpreters with uv instead of using runner installations.
  UV_MANAGED_PYTHON: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint, format, and type checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install
      - name: Sync dev dependencies
        run: uv sync --only-dev --no-install-project
      - name: Run checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check --python-version 3.11
          uv run --no-sync ty check --python-version 3.15

  go_test:
    name: Go race and signature checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the bundled Archivematica signature
        run: go run ./internal/signatures/cmd/update -check
      - name: Run Go tests with the race detector
        run: go test -race .
      - name: Check Go modernization
        run: go fix -diff . ./internal/...

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs:
      - lint
      - go_test
    permissions:
      contents: read
    env:
      PRETEND_VERSION: ${{ inputs.package_version }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install
      - name: Sync dev dependencies
        run: uv sync --only-dev --no-install-project
      - name: Build sdist
        run: |
          if [[ -n "${PRETEND_VERSION}" ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${PRETEND_VERSION}"
          fi
          uv build --sdist
      - name: Check sdist
        run: uv run --no-sync python -m twine check --strict dist/*.tar.gz
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz

  source_compat:
    name: Build and test ${{ matrix.name }} sdist (py3.15)
    runs-on: ${{ matrix.runner }}
    needs: sdist
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            macosx_deployment_target: ""
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            macosx_deployment_target: ""
          - name: macos-arm64
            runner: macos-14
            macosx_deployment_target: "13.0"
          - name: windows-x86_64
            runner: windows-latest
            macosx_deployment_target: ""
    env:
      UV_PYTHON: "3.15"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Download sdist artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-sdist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install 3.11 3.15
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Sync dev dependencies
        run: uv sync --only-dev --no-install-project
      - name: Build wheel from sdist
        run: uv build --wheel dist/*.tar.gz
      - name: Check distributions
        run: uv run --no-sync python -m twine check --strict dist/*
      - name: Test wheel installation
        run: |
          uv pip install --python .venv dist/*.whl
          uv run --no-sync python -m pytest
      - name: Test source-built wheel on minimum Python
        run: |
          uv sync --only-dev --no-install-project --python 3.11
          uv pip install --python .venv dist/*.whl
          uv run --no-sync --python 3.11 python -m pytest
      - name: Smoke test wheel with uvx
        run: ./.github/scripts/smoke-install.sh dist/*.whl 3.15

  build:
    name: Build ${{ matrix.name }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    needs:
      - lint
      - go_test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: linux
            runner: ubuntu-24.04
            python-version: "3.11"
            manylinux_image: quay.io/pypa/manylinux2014_x86_64:latest
            go_tarball: linux-amd64
            artifact_name: python-wheel-linux-x86_64-py3.11
            macosx_deployment_target: ""
          - name: linux-aarch64
            platform: linux
            runner: ubuntu-24.04-arm
            python-version: "3.11"
            manylinux_image: quay.io/pypa/manylinux2014_aarch64:latest
            go_tarball: linux-arm64
            artifact_name: python-wheel-linux-aarch64-py3.11
            macosx_deployment_target: ""
          - name: macos-arm64
            platform: macos
            runner: macos-14
            python-version: "3.11"
            manylinux_image: ""
            go_tarball: ""
            artifact_name: python-wheel-macos-arm64-py3.11
            macosx_deployment_target: "13.0"
          - name: windows-x86_64
            platform: windows
            runner: windows-latest
            python-version: "3.11"
            manylinux_image: ""
            go_tarball: ""
            artifact_name: python-wheel-windows-x86_64-py3.11
            macosx_deployment_target: ""
    env:
      PRETEND_VERSION: ${{ inputs.package_version }}
      UV_PYTHON: ${{ matrix.python-version }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install
      # Linux installs Go inside the manylinux container; macOS and Windows
      # build on the host runner and need Go provisioned here.
      - name: Set up Go
        if: matrix.platform != 'linux'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Sync dev dependencies
        run: uv sync --only-dev --no-install-project
      - name: Build wheel (Linux)
        if: matrix.platform == 'linux'
        run: |
          rm -rf dist
          mkdir -p dist
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod)"
          DOCKER_ENV=()
          if [[ -n "${PRETEND_VERSION}" ]]; then
            DOCKER_ENV+=(--env "SETUPTOOLS_SCM_PRETEND_VERSION=${PRETEND_VERSION}")
          fi
          docker run --rm \
            --volume "${PWD}:/src:ro" \
            --volume "${PWD}/dist:/dist:rw" \
            --user "$(id -u):$(id -g)" \
            "${DOCKER_ENV[@]}" \
            "${{ matrix.manylinux_image }}" \
            bash -o pipefail -euxc '
              cp -a /src/. /tmp/src
              cd /tmp
              curl --silent --location "https://go.dev/dl/go'"${GO_VERSION}"'.${{ matrix.go_tarball }}.tar.gz" | tar -xz
              export PATH="/tmp/go/bin:$PATH" HOME=/tmp GOCACHE=/tmp/go-cache
              /opt/python/cp311-cp311/bin/pip wheel --no-deps --wheel-dir /tmp /tmp/src
              auditwheel repair /tmp/*.whl --wheel-dir /dist
            '
          uv run --no-sync python -m twine check --strict dist/*.whl
      - name: Build wheel (macOS/Windows)
        if: matrix.platform != 'linux'
        run: |
          if [[ -n "${PRETEND_VERSION}" ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${PRETEND_VERSION}"
          fi
          # Use the matrix interpreter for the isolated build environment.
          uv build --wheel --python "${{ matrix.python-version }}"
          uv run --no-sync python -m twine check --strict dist/*.whl
      - name: Test wheel installation
        run: |
          uv pip install --python .venv dist/*.whl
          uv run --no-sync python -m pytest
      - name: Smoke test wheel with uvx
        run: ./.github/scripts/smoke-install.sh dist/*.whl "${{ matrix.python-version }}"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.whl

  abi3_compat:
    name: Test ${{ matrix.target.name }} abi3 wheel (py${{ matrix.python-version }})
    runs-on: ${{ matrix.target.runner }}
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        target:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-14
          - name: windows-x86_64
            runner: windows-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-wheel-${{ matrix.target.name }}-py3.11
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Sync dev dependencies
        run: uv sync --only-dev --no-install-project
      - name: Test wheel installation
        run: |
          uv pip install --python .venv dist/*.whl
          uv run --no-sync python -m pytest
      - name: Smoke test wheel with uvx
        run: ./.github/scripts/smoke-install.sh dist/*.whl "${{ matrix.python-version }}"
